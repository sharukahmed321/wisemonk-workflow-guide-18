name: Manual Development Deploy (wisemonk-fe-dev)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy to dev (wisemonk-fe-dev)"
        required: true
        default: "empLeave"

concurrency:
  group: manual-dev-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  FIREBASE_PROJECT_ID: 'wisemonk-fe'

jobs:
  deploy:
    name: Deploy to Development Live (wisemonk-fe-dev)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code (selected branch)
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies (tolerate peer conflicts)
      run: npm ci --legacy-peer-deps

    - name: Run linter (non-blocking)
      run: npm run lint || echo "Lint errors detected (non-blocking)"
      continue-on-error: true

    - name: Type check
      run: npx tsc --noEmit

    - name: Build application
      run: npm run build
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
        VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
        VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

    - name: Prepare Firebase service account JSON (raw or base64)
      id: sa
      shell: bash
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      run: |
        if echo "$FIREBASE_SERVICE_ACCOUNT" | grep -q '^{'; then
          JSON="$FIREBASE_SERVICE_ACCOUNT"
        else
          JSON=$(echo "$FIREBASE_SERVICE_ACCOUNT" | base64 -d)
        fi
        ONE_LINE=$(echo "$JSON" | tr -d '\n' | tr -d '\r')
        echo "json=$ONE_LINE" >> "$GITHUB_OUTPUT"

    - name: Deploy to Firebase Hosting (Development Live - target dev)
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        repoToken: '${{ secrets.GITHUB_TOKEN }}'
        firebaseServiceAccount: '${{ steps.sa.outputs.json }}'
        channelId: live
        target: dev
        projectId: ${{ env.FIREBASE_PROJECT_ID }}

    - name: Deployment Success
      run: |
        echo "🎉 Dev deployment successful!"
        echo "🌐 Dev URL: https://wisemonk-fe-dev.web.app"

